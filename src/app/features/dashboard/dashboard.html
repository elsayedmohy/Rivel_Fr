<section class="rl-page">
  <header class="rl-page__heading">
    <div>
    <h1 class="rl-page__title">{{ 'dashboard.title' | translate }}</h1>
    <p class="rl-page__subtitle">{{ 'dashboard.subtitle' | translate }}</p>
    </div>
  </header>

  <div class="rl-page__grid">
    @for (action of visibleActions(); track action.routerLink) {
        <a [routerLink]="action.routerLink">
      <rl-card>
          <tui-icon [icon]="action.icon" class="icon" />
          <div>
            <h3>{{ action.label() }}</h3>
            <p >{{ action.hint() }}</p>
          </div>
      </rl-card>
        </a>
    }
  </div>
</section>
